[functions.ai-chat]
verify_jwt = true

[functions.youtube-search]
verify_jwt = true

[auth.passkey]
enabled = true

# Substitua pelos dados reais do seu domínio de produção.
# O rp_id deve ser o domínio sem https:// e sem caminho.
[auth.webauthn]
rp_display_name = "Meu Treino"
rp_id = "SEU-DOMINIO"
rp_origins = ["https://SEU-DOMINIO"]
